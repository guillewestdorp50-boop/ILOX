<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21140d"><title>ILOX · Truco argentino</title>
<style>
:root{--gold:#d5ae6b;--cream:#f5e8c9;--wood:#61391f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b110b;color:var(--cream);font-family:Georgia,serif}
#game{height:100dvh;width:100vw;position:relative;overflow:hidden;background:#2b190f}\n#game::before{content:'';position:absolute;inset:-22px;z-index:0;background-image:linear-gradient(90deg,#1a0d07aa,#1a0d0755,#1a0d07aa),url('./truco-table.avif');background-position:center;background-size:cover;filter:blur(12px) brightness(.78) saturate(1.08);transform:scale(1.04);pointer-events:none}\n#game::after{content:'';position:absolute;z-index:0;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.7778vh);height:min(100dvh,56.25vw);background:url('./truco-table.avif') center/100% 100% no-repeat;pointer-events:none;box-shadow:0 0 38px #160b06aa}\n.room{z-index:1}
.top{position:absolute;z-index:5;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:linear-gradient(#100a07dd,#100a0766);font:700 11px system-ui;letter-spacing:.13em}
.brand{font:700 17px Georgia;color:#e6c78e;letter-spacing:.2em}.score{color:#f4dcae}
.room{position:absolute;inset:0;perspective:1000px;overflow:hidden}
.backwall{position:absolute;inset:0 0 42%;background:linear-gradient(180deg,#25170f,#57371f 70%,#21140d);border-bottom:8px solid #29170d}
.window{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:min(32vw,260px);height:21%;border:9px solid #25170f;background:linear-gradient(90deg,#263a30,#9a895c,#314435);box-shadow:0 0 40px #d3a15a33}
.opponent{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:210px;height:140px;text-align:center}
.op-head{width:72px;height:72px;border-radius:50%;margin:auto;background:radial-gradient(circle at 45% 35%,#d9a77b 0 30%,#74452e 32% 65%,#21130d 67%);box-shadow:0 8px 15px #0008}
.op-body{width:190px;height:90px;margin:-4px auto 0;border-radius:90px 90px 10px 10px;background:linear-gradient(90deg,#292d25,#596049,#26271f);box-shadow:0 10px 20px #0009}
.op-label{font:10px system-ui;letter-spacing:.15em;color:#e9d2a8;margin-top:-78px;position:relative}
.table{position:absolute;left:-16%;width:132%;height:65%;bottom:7%;border-radius:50%;transform:rotateX(56deg);transform-origin:center bottom;background:radial-gradient(ellipse at 50% 40%,#95643a 0,#6e4528 55%,#3c2416 78%,#24150d 100%);border:18px solid #321d10;box-shadow:0 28px 0 #160d08,0 35px 35px #000b,inset 0 0 0 5px #b07a43,inset 0 0 50px #21130c}
.table:after{content:"";position:absolute;inset:6%;border:2px solid #c18b4b66;border-radius:50%}
.tablegrain{position:absolute;inset:10%;opacity:.12;background:repeating-linear-gradient(8deg,transparent 0 18px,#e3b57a 19px 20px,transparent 21px 37px);border-radius:50%}
.center{position:absolute;z-index:2;left:50%;top:49%;transform:translate(-50%,-50%);width:100%;height:150px;display:flex;justify-content:center;align-items:center;gap:10px}
.played{width:70px;height:104px;border-radius:8px;background:#eee0c2;color:#291c12;border:2px solid #d3b98a;box-shadow:0 8px 14px #0008;display:grid;place-items:center;font: bold 27px Georgia;transform:rotate(-5deg)}
.played small{font:10px system-ui;display:block}
.opcards{position:absolute;z-index:3;top:35%;left:50%;transform:translateX(-50%);display:flex;gap:-14px}
.backcard{width:42px;height:62px;margin-left:-12px;border-radius:5px;border:2px solid #d8c29a;background:repeating-linear-gradient(45deg,#7b1f1e 0 4px,#e6d7b4 4px 6px);box-shadow:0 3px 6px #0008}
.myhand{position:absolute;z-index:6;left:0;right:0;bottom:5%;height:39%;display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,1vw,12px);padding:0 12px 0;pointer-events:none}
.handglow{position:absolute;bottom:-13%;left:50%;transform:translateX(-50%);width:95%;height:88%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at center,#d9a36a66,transparent 70%);pointer-events:none}
.hand{position:absolute;bottom:-5%;width:42%;height:56%;background:radial-gradient(ellipse at 50% 45%,#dba77c 0 45%,#a96d4e 65%,transparent 70%);filter:drop-shadow(0 -5px 8px #0008);pointer-events:none}
.hand.left{left:-14%;transform:rotate(18deg)}.hand.right{right:-14%;transform:rotate(-18deg)}
.card{pointer-events:auto;position:relative;width:clamp(70px,11vw,145px);height:clamp(112px,29vh,190px);border-radius:10px;border:2px solid #d9c49a;background:linear-gradient(135deg,#fff8e7,#e8d8b7);color:#25180f;box-shadow:0 9px 18px #0009,inset 0 0 0 3px #fff9;transform:rotate(var(--rot)) translateY(var(--lift,0));transform-origin:bottom center;transition:transform .18s,box-shadow .18s;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
.card:before{content:"";position:absolute;inset:5px;border:1px solid #b99b69;border-radius:6px;pointer-events:none}
.card.red{color:#9d2920}.card .rank{position:absolute;top:8px;left:9px;font:bold 18px Georgia}.card .rank.bottom{top:auto;left:auto;bottom:8px;right:9px;transform:rotate(180deg)}
.card .suit{font-size:clamp(37px,9vw,58px);line-height:1}.card .name{font:9px system-ui;letter-spacing:.08em;margin-top:8px}
.card.selected{--lift:-34px;box-shadow:0 18px 30px #000c,0 0 0 3px var(--gold);z-index:4}
.card.playedout{opacity:0;transform:translateY(-230px) scale(.75);pointer-events:none}
.controls{position:absolute;z-index:10;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 2%;gap:9px;align-items:center;pointer-events:none}.controls .action{pointer-events:auto}
.action{border:1px solid #d5ae6b;border-radius:18px;background:linear-gradient(#49301e,#24150d);color:#f6e7c7;padding:13px 22px;font:800 10px system-ui;letter-spacing:.13em;box-shadow:0 4px 12px #0009;white-space:nowrap}
.action.primary{background:linear-gradient(#159b38,#087425);color:#fff;border-color:#73d58b}.action:disabled{opacity:.38}
.status{position:absolute;z-index:8;bottom:calc(35% + 8px);left:50%;transform:translateX(-50%);font:700 10px system-ui;letter-spacing:.1em;text-shadow:0 2px 5px #000;text-align:center;width:90%}
.toast{position:absolute;z-index:12;top:58px;left:50%;transform:translateX(-50%);padding:8px 14px;background:#170e09dd;border:1px solid #c69a5a;border-radius:20px;font:11px system-ui;white-space:nowrap;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
@media(max-height:600px){.myhand{height:37%;bottom:7%}.card{height:clamp(105px,27vh,170px);width:clamp(66px,10vw,125px)}.status{bottom:43%}}\n@media(max-width:600px){.card{width:clamp(72px,21vw,108px);height:clamp(118px,22vh,170px)}.myhand{bottom:7%;height:34%;gap:0}.controls{bottom:8px;padding:0 10px}.action{padding:10px 13px;font-size:9px}}
@media(orientation:landscape){#game::after{width:min(100vw,177.7778vh);height:min(100dvh,56.25vw)}}\n@media(orientation:portrait){#game::after{width:100vw;height:56.25vw}}\n
/* Baraja española Tatú: sprite CC0, 40 cartas reales */
.card{background-image:url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Cartas_Tat%C3%BA.png/1280px-Cartas_Tat%C3%BA.png');background-size:1000% 400%;background-repeat:no-repeat;background-color:#eee0c2;padding:0;overflow:hidden}
.card:before{inset:3px;border-color:#9c8059}
.card .rank,.card .suit,.card .name{display:none}
.played{background-image:url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Cartas_Tat%C3%BA.png/1280px-Cartas_Tat%C3%BA.png');background-size:1000% 400%;background-repeat:no-repeat;background-color:#eee0c2;color:transparent;border:1px solid #d3b98a}
</style></head><body><main id="game">
<header class="top" style="display:none"><div class="brand">ILOX</div><div>TRUCO ARGENTINO</div><div class="score">VOS <b id="mine">0</b> — <b id="theirs">0</b> RIVAL</div></header>
<section class="room"><div class="backwall" style="display:none"><div class="window"></div><div class="opponent"><div class="op-head"></div><div class="op-body"></div><div class="op-label">TU CONTRINCANTE</div></div></div>
<div class="table" style="display:none"><div class="tablegrain"></div></div><div class="opcards" id="opcards" style="display:none"><i class="backcard"></i><i class="backcard"></i><i class="backcard"></i></div>
<div class="center" id="center"><div style="font:11px system-ui;letter-spacing:.14em;color:#f2d7a8;text-shadow:0 2px 5px #000">LA MESA ESTÁ LISTA</div></div>
<div class="myhand" id="myhand"><div class="handglow" style="display:none"></div><div class="hand left" style="display:none"></div><div class="hand right" style="display:none"></div></div>
</section>
<div class="status" id="status">ELEGÍ UNA CARTA DE TU MANO</div><div class="toast" id="toast"></div>
<div class="controls"><button class="action" id="new">CERRAR MANO</button><button class="action primary" id="throw" disabled>TIRAR CARTA</button></div>
</main>
<script>
const suits=[{s:'⚔',n:'ESPADA',c:'dark'},{s:'🪙',n:'ORO',c:'gold'},{s:'🥤',n:'COPA',c:'red'},{s:'♣',n:'BASTO',c:'dark'}];
const ranks=['1','2','3','4','5','6','7','10','11','12'];
let hand=[],selected=-1,played=0,scoreMe=0,scoreRival=0,round=0;
const $=id=>document.getElementById(id);
function makeDeck(){let d=[];for(let si=0;si<4;si++)for(const r of ranks)d.push({r,s:suits[si].s,n:suits[si].n,c:si===2?'red':'dark',v:r});return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function renderHand(){const root=$('myhand');root.querySelectorAll('.card').forEach(x=>x.remove());hand.forEach((c,i)=>{const el=document.createElement('button');el.className='card '+c.c+(selected===i?' selected':'');el.style.setProperty('--rot',((i-1)*7)+'deg');el.setAttribute('aria-label',c.r+' de '+c.n);const col=ranks.indexOf(c.r);const row=({ESPADA:0,COPA:1,ORO:2,BASTO:3})[c.n];el.style.backgroundPosition=(col/9*100)+'% '+(row/3*100)+'%';el.addEventListener('click',()=>{selected=selected===i?-1:i;renderHand();$('throw').disabled=selected<0;$('status').textContent=selected<0?'ELEGÍ UNA CARTA DE TU MANO':'SELECCIONASTE '+c.r+' DE '+c.n});root.appendChild(el)})}
function deal(){hand=shuffle(makeDeck()).slice(0,3);selected=-1;played=0;$('center').innerHTML='<div style="font:11px system-ui;letter-spacing:.14em;color:#f2d7a8;text-shadow:0 2px 5px #000">LA MANO COMIENZA</div>';$('opcards').innerHTML='<i class="backcard"></i><i class="backcard"></i><i class="backcard"></i>';$('throw').disabled=true;$('status').textContent='ELEGÍ UNA CARTA DE TU MANO';renderHand();say('¡Cartas repartidas!')}
function throwCard(){if(selected<0||!hand[selected])return;const c=hand.splice(selected,1)[0];const slot=document.createElement('div');slot.className='played '+c.c;const col=ranks.indexOf(c.r);const row=({ESPADA:0,COPA:1,ORO:2,BASTO:3})[c.n];slot.style.backgroundPosition=(col/9*100)+'% '+(row/3*100)+'%';const empty=$('center').querySelector('div[style]');if(empty)empty.remove();$('center').appendChild(slot);played++;selected=-1;$('throw').disabled=true;renderHand();$('status').textContent='TIRASTE '+c.r+' DE '+c.n+' · EL RIVAL ESTÁ JUGANDO';setTimeout(()=>{const rival=makeDeck()[Math.floor(Math.random()*40)];const rs=document.createElement('div');rs.className='played';rs.style.transform='rotate(5deg)';const rc=ranks.indexOf(rival.r);const rr=({ESPADA:0,COPA:1,ORO:2,BASTO:3})[suits.find(x=>x.s===rival.s).n];rs.style.backgroundPosition=(rc/9*100)+'% '+(rr/3*100)+'%';$('center').appendChild(rs);$('opcards').querySelector('.backcard')?.remove();if(played===3){const winner=Math.random()>.5;winner?scoreMe++:scoreRival++;$('mine').textContent=scoreMe;$('theirs').textContent=scoreRival;$('status').textContent=winner?'GANASTE LA MANO':'EL RIVAL GANÓ LA MANO';say(winner?'¡Buena! Punto para vos':'Punto para el rival')}else{$('status').textContent='RONDA '+played+' · TU TURNO'}},750)}
$('throw').addEventListener('click',throwCard);$('new').addEventListener('click',deal);deal();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",async()=>{try{const r=await navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"});await r.update()}catch(e){}})}</script>
</body></html>
