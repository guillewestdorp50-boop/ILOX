<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24170f"><title>ILOX · Truco en primera persona</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a100a;color:#fff;font-family:system-ui,Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;user-select:none}
.hitzone{position:absolute;bottom:8%;height:38%;width:17%;border:0;background:transparent;border-radius:18px;cursor:pointer;outline:0}
.hitzone:focus,.hitzone.selected{background:linear-gradient(0deg,#f7d48b55,transparent 75%);box-shadow:0 0 0 2px #f4d18b99 inset}
#c1{left:28%}#c2{left:39%}#c3{left:50%}#c4{left:61%}
#play{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);border:1px solid #e5c17c;border-radius:22px;padding:10px 24px;background:#2b1b11eF;color:#f8e8c7;font-weight:800;letter-spacing:.12em;font-size:11px;box-shadow:0 3px 12px #0008}
#play:disabled{opacity:.45}
#hint{position:absolute;left:50%;bottom:1%;transform:translate(-50%,100%);font-size:10px;color:#f7e5c5;text-shadow:0 1px 4px #000}
@media(max-width:600px){#c1{left:8%;width:20%}#c2{left:27%;width:20%}#c3{left:46%;width:20%}#c4{left:65%;width:20%}#play{bottom:2%;padding:9px 18px}}
</style></head><body>
<img id="scene" alt="Vista en primera persona de una partida de truco argentino: tus manos sostienen cartas españolas sobre una mesa grande de madera, con otros jugadores y un mate."/>
<button class="hitzone" id="c1" aria-label="Seleccionar primera carta"></button><button class="hitzone" id="c2" aria-label="Seleccionar segunda carta"></button><button class="hitzone" id="c3" aria-label="Seleccionar tercera carta"></button><button class="hitzone" id="c4" aria-label="Seleccionar cuarta carta"></button>
<button id="play" disabled>TIRAR CARTA</button><div id="hint">TOCÁ UNA CARTA PARA SELECCIONARLA</div>
<script>
const scene=document.getElementById('scene');
fetch('./truco-scene.jpg.b64').then(r=>r.text()).then(b=>{scene.src='data:image/jpeg;base64,'+b.trim()}).catch(()=>{scene.alt='No se pudo cargar la escena de la mesa';});
const zones=[...document.querySelectorAll('.hitzone')],play=document.getElementById('play'),hint=document.getElementById('hint');let selected=-1;
zones.forEach((z,i)=>z.addEventListener('click',()=>{selected=i;zones.forEach((x,j)=>x.classList.toggle('selected',i===j));play.disabled=false;hint.textContent='CARTA '+(i+1)+' SELECCIONADA'}));
play.addEventListener('click',()=>{if(selected<0)return;hint.textContent='CARTA '+(selected+1)+' LISTA PARA JUGAR';play.disabled=true;zones[selected].classList.remove('selected');selected=-1});
</script>
<script>if("serviceWorker"in navigator){let once=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(once)return;once=true;location.reload()});addEventListener("load",async()=>{try{const r=await navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"});await r.update()}catch(e){}})}</script>
</body></html>
