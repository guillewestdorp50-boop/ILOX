/* En Android, si el equipo está apaisado, el primer toque activa pantalla completa
   y solicita orientación vertical. En modo instalado, el manifiesto también la fija. */
(function(){
  let requested=false;
  function forcePortrait(){
    if(requested || !window.matchMedia('(orientation: landscape)').matches) return;
    requested=true;
    const lock=()=>{try{const p=screen.orientation?.lock?.('portrait');if(p&&p.catch)p.catch(()=>{});}catch(e){}};
    if(document.fullscreenElement){lock();return;}
    const enter=document.documentElement.requestFullscreen;
    if(enter){try{const p=enter.call(document.documentElement);if(p&&p.then)p.then(lock).catch(lock);else lock();}catch(e){lock();}}
    else lock();
  }
  window.addEventListener('pointerdown',forcePortrait,{once:true,passive:true});
  window.addEventListener('touchstart',forcePortrait,{once:true,passive:true});
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=5'));
</script>
