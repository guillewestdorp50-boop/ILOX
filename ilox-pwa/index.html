<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24170f">
<title>ILOX · Truco criollo</title>
<style>
:root{color-scheme:dark;--cream:#f3e7ca;--gold:#c99b52;--wood:#57351f;--green:#294a36;--ink:#251b13}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b120d;color:var(--cream);font-family:Georgia,'Times New Roman',serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{height:100%;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#49301d,#1b120d 78%)}
header{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#160e09;border-bottom:1px solid #a77a423d;font:700 10px system-ui;letter-spacing:.16em}
.brand{font:bold 17px Georgia;color:#e0bd7b;letter-spacing:.2em}.room{color:#c6ad83}.score{color:#e5cf9e}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:10px}
.table{position:relative;width:min(100%,1050px);height:min(100%,650px);min-height:330px;border:15px solid #57371f;border-radius:28px;background:linear-gradient(135deg,#765032,#3f2818 35%,#684329 68%,#3a2416);box-shadow:inset 0 0 0 2px #bd8b4c,inset 0 0 0 7px #29190f,0 18px 45px #000b;overflow:hidden}
.table:before{content:"";position:absolute;inset:14px;border:1px solid #d0a76766;border-radius:18px;pointer-events:none}
.cloth{position:absolute;inset:7% 8%;border:2px solid #b68a4f;border-radius:22px;background:repeating-linear-gradient(0deg,#294a36 0 36px,#2c503b 37px 38px);box-shadow:inset 0 0 35px #0b2118,inset 0 0 0 7px #1e392a}
.cloth:before{content:"";position:absolute;inset:10px;border:1px dashed #c9a66b77;border-radius:15px}
.ornament{position:absolute;left:50%;top:8%;transform:translateX(-50%);font:700 10px system-ui;letter-spacing:.32em;color:#d6bb82a8;white-space:nowrap}
.player{position:absolute;z-index:2;display:flex;align-items:center;gap:7px;font:700 10px system-ui;color:#f3e6c8;text-shadow:0 2px 3px #000}
.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#e4c58b,#87562f);border:2px solid #e9d3a8;color:#382417;font-weight:900}
.north{top:12%;left:50%;transform:translateX(-50%);flex-direction:column}.west{left:10%;top:48%;flex-direction:column}.east{right:10%;top:48%;flex-direction:column}
.backhand{display:flex;margin-top:3px}.back{width:26px;height:39px;margin-left:-10px;border:2px solid #e8d4aa;border-radius:4px;background:repeating-linear-gradient(45deg,#6b3428 0 4px,#d8bd83 4px 6px);box-shadow:0 2px 5px #0008}.back:first-child{margin-left:0}
.center{position:absolute;z-index:2;left:50%;top:53%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,28px);width:65%}
.zone{width:clamp(58px,9vw,82px);height:clamp(82px,13vw,114px);border:1px dashed #d6c09277;border-radius:7px;display:grid;place-items:center;text-align:center;font:700 9px system-ui;letter-spacing:.12em;color:#e1d0a080}
.played{display:flex;gap:5px;min-width:64px;justify-content:center}
.card{position:relative;flex:none;width:clamp(49px,7vw,68px);height:clamp(75px,10.8vw,98px);border-radius:7px;background:linear-gradient(145deg,#fff9e9,#eadfc6);color:#31271e;border:1px solid #c8b995;box-shadow:0 4px 9px #0008;display:flex;align-items:center;justify-content:center;font-size:clamp(23px,4vw,34px);cursor:pointer;user-select:none;transition:transform .15s,box-shadow .15s}
.card .rank{position:absolute;top:5px;left:6px;font:bold 10px/1.1 Georgia;text-align:center}.card .rank.bottom{top:auto;left:auto;bottom:5px;right:6px;transform:rotate(180deg)}
.oro{color:#a56e17}.copa{color:#a62e32}.espada{color:#343c47}.basto{color:#77502d}
.card.selected{transform:translateY(-12px);box-shadow:0 0 0 3px #e6c27b,0 12px 18px #0008}
.mate{position:absolute;right:8%;bottom:8%;z-index:1;width:42px;height:48px;transform:rotate(-12deg)}
.mate:before{content:"";position:absolute;left:5px;bottom:0;width:30px;height:33px;border-radius:8px 8px 13px 13px;background:linear-gradient(90deg,#704a27,#b17a3c,#684222);border:2px solid #d0a76c}
.mate:after{content:"";position:absolute;left:25px;top:-4px;width:3px;height:34px;background:#c5b9a0;transform:rotate(17deg);border-radius:3px}
.seat{flex:none;min-height:148px;padding:6px 10px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;background:linear-gradient(0deg,#100a06,#1b120dcc 75%,transparent)}
.you{display:flex;align-items:center;gap:8px;font:700 11px system-ui;color:#e8d6b4}.you .avatar{width:25px;height:25px}
.hand{display:flex;align-items:flex-end;justify-content:center;width:100%;min-height:91px;padding:3px 8px 0}.hand .card{margin-left:-5px}.hand .card:first-child{margin-left:0}
.controls{height:34px;display:flex;align-items:center;justify-content:center;gap:8px}
button{border:1px solid #c49b5d;border-radius:4px;padding:7px 15px;background:linear-gradient(#67462a,#392516);color:#f1dfb9;font:700 9px system-ui;letter-spacing:.13em}
button:disabled{opacity:.4}
@media(max-width:600px){header{height:40px;padding:0 10px;font-size:9px}.stage{padding:5px 3px}.table{border-width:9px;border-radius:18px;min-height:300px}.cloth{inset:7% 5%}.north{top:10%}.west{left:6%}.east{right:6%}.player{font-size:9px}.avatar{width:25px;height:25px}.back{width:21px;height:32px;margin-left:-9px}.center{width:70%;top:53%;gap:7px}.seat{min-height:138px}.hand{min-height:85px}.hand .card{margin-left:-13px}.hand .card:first-child{margin-left:0}.mate{right:5%;bottom:9%;transform:scale(.8) rotate(-12deg)}}
@media(orientation:landscape) and (max-height:520px){header{height:34px}.stage{padding:3px 8px}.table{height:100%;min-height:240px;width:min(100%,1050px)}.seat{min-height:102px;padding-bottom:3px}.hand{min-height:62px}.hand .card{height:62px;width:44px}.back{height:25px;width:18px}.north{top:8%}.center{top:53%}}
</style>
</head>
<body>
<div class="app">
<header><span class="brand">ILOX</span><span class="room">TRUCO CRIOLLO · MESA GAUCHA</span><span class="score">NOSOTROS 0 — ELLOS 0</span></header>
<main class="stage"><section class="table" aria-label="Mesa argentina de truco">
<div class="cloth"></div><div class="ornament">★ · BUENAS Y SANTAS · ★</div>
<div class="player north"><div class="avatar">J2</div><span>COMPAÑERO</span><div class="backhand"><i class="back"></i><i class="back"></i><i class="back"></i></div></div>
<div class="player west"><div class="avatar">J3</div><span>RIVAL</span><div class="backhand"><i class="back"></i><i class="back"></i><i class="back"></i></div></div>
<div class="player east"><div class="avatar">J4</div><span>RIVAL</span><div class="backhand"><i class="back"></i><i class="back"></i><i class="back"></i></div></div>
<div class="center"><div class="zone">MAZO<br>40 NAIPES</div><div class="played" id="played"><div class="zone">CARTAS<br>JUGADAS</div></div><div class="zone">PUNTAJE<br>TRUCO</div></div>
<div class="mate" aria-label="Mate"></div>
</section></main>
<footer class="seat"><div class="you"><span class="avatar">YO</span><strong>TUS TRES CARTAS</strong><span id="count">· 3 en mano</span></div>
<div class="hand" id="hand" aria-label="Tus cartas">
<div class="card oro" data-card="1"><span class="rank">1<br>ORO</span>●<span class="rank bottom">1<br>ORO</span></div>
<div class="card copa" data-card="2"><span class="rank">7<br>COPA</span>♥<span class="rank bottom">7<br>COPA</span></div>
<div class="card basto" data-card="3"><span class="rank">3<br>BASTO</span>♣<span class="rank bottom">3<br>BASTO</span></div>
</div><div class="controls"><button id="play" disabled>TIRAR CARTA</button><button id="sort" type="button">ACOMODAR</button></div></footer>
</div>
<script>
const hand=document.getElementById('hand'),play=document.getElementById('play'),played=document.getElementById('played'),count=document.getElementById('count');
hand.addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;hand.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c===card));play.disabled=false;});
play.addEventListener('click',()=>{const card=hand.querySelector('.selected');if(!card)return;card.classList.remove('selected');const copy=card.cloneNode(true);copy.style.cursor='default';copy.style.transform='none';copy.removeAttribute('data-card');played.replaceChildren(copy);card.remove();count.textContent='· '+hand.children.length+' en mano';play.disabled=true;});
document.getElementById('sort').addEventListener('click',()=>{[...hand.children].reverse().forEach(c=>hand.appendChild(c));});
</script>
<script>
if("serviceWorker"in navigator){let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload()});addEventListener("load",async()=>{try{const r=await navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"});await r.update()}catch(e){console.warn("No se pudo actualizar:",e)}})}
</script>
</body></html>
