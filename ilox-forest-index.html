<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c1712" />
  <meta name="description" content="ILOX: explorá un mundo abierto 3D con tu personaje." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./ilox.css" />
  <title>ILOX — Mundo abierto</title>
</head>
<body>
  <div id="app" aria-label="Mundo abierto 3D de ILOX"></div>
  <div id="overlay">
    <div class="brand">ILOX</div>
    <p class="sub">UN MUNDO ABIERTO TE ESPERA</p>
    <button id="play" type="button" disabled>PREPARANDO EL MUNDO…</button>
    <div id="loadwrap">
      <div id="loadbar"><div id="loadfill"></div></div>
      <div id="loadtext">Cargando terreno, senderos y bosque…</div>
    </div>
    <div id="controls">
      <span>W A S D · MOVERSE</span>
      <span>MOUSE · MIRAR</span>
      <span>SHIFT · CORRER</span>
      <span>ARRASTRAR · GIRAR CÁMARA</span>
    </div>
    <div id="credits">
      Mundo base editable adaptado de <a href="https://github.com/jalexiscv/TheForest" target="_blank" rel="noopener">The Forest</a> · Licencia MIT
    </div>
  </div>
  <div id="touch-ui" aria-label="Controles táctiles">
    <div id="joystick"><div id="stick"></div></div>
    <div class="touch-note">MOVER</div>
    <div class="look-note">DESLIZÁ PARA MIRAR</div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
