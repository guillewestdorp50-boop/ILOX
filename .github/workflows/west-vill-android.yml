name: WEST-VILL Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - west-vill-android

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate permanent signing credentials
        env:
          WV_ANDROID_KEYSTORE_BASE64: ${{ secrets.WV_ANDROID_KEYSTORE_BASE64 }}
          WV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WV_ANDROID_KEYSTORE_PASSWORD }}
          WV_ANDROID_KEY_ALIAS: ${{ secrets.WV_ANDROID_KEY_ALIAS }}
          WV_ANDROID_KEY_PASSWORD: ${{ secrets.WV_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$WV_ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing WV_ANDROID_KEYSTORE_BASE64 repository secret"; exit 1)
          test -n "$WV_ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing WV_ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1)
          test -n "$WV_ANDROID_KEY_ALIAS" || (echo "::error::Missing WV_ANDROID_KEY_ALIAS repository secret"; exit 1)
          test -n "$WV_ANDROID_KEY_PASSWORD" || (echo "::error::Missing WV_ANDROID_KEY_PASSWORD repository secret"; exit 1)

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent signing key
        id: signing
        env:
          WV_ANDROID_KEYSTORE_BASE64: ${{ secrets.WV_ANDROID_KEYSTORE_BASE64 }}
          WV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WV_ANDROID_KEYSTORE_PASSWORD }}
          WV_ANDROID_KEY_ALIAS: ${{ secrets.WV_ANDROID_KEY_ALIAS }}
          WV_ANDROID_KEY_PASSWORD: ${{ secrets.WV_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re, base64, binascii, pathlib, subprocess, sys
          raw = os.environ["WV_ANDROID_KEYSTORE_BASE64"]
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          report = [
              "WEST-VILL Android signing diagnostics",
              f"Secret present: {bool(raw)}",
              f"Original character count: {len(raw)}",
              f"Base64 character count after cleanup: {len(cleaned)}",
              f"Base64 length remainder modulo 4: {len(cleaned) % 4}",
              f"Padding characters: {cleaned.count('=')}",
          ]
          try:
              if not cleaned:
                  raise ValueError("The Base64 secret is empty after cleanup.")
              if "=" in cleaned[:-2]:
                  raise ValueError("Base64 padding appears before the end of the value.")
              padded = cleaned + ("=" * ((-len(cleaned)) % 4))
              data = base64.b64decode(padded, validate=True)
              if len(data) < 100:
                  raise ValueError(f"Decoded data is only {len(data)} bytes; this is not a plausible Android keystore.")
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "west-vill-release.jks"
              path.write_bytes(data)
              check = None
              accepted_type = None
              diagnostics = []
              for store_type in ("JKS", "PKCS12"):
                  candidate = subprocess.run(
                      ["keytool", "-list", "-storetype", store_type, "-keystore", str(path),
                       "-storepass", os.environ["WV_ANDROID_KEYSTORE_PASSWORD"],
                       "-alias", os.environ["WV_ANDROID_KEY_ALIAS"]],
                      text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
                  )
                  diagnostics.append(f"{store_type}: {candidate.stdout.strip()[-600:]}")
                  if candidate.returncode == 0:
                      check = candidate
                      accepted_type = store_type
                      break
              if check is None:
                  report.append("Keystore decode: SUCCESS")
                  report.append("Keystore validation: FAILED for JKS and PKCS12")
                  report.append("keytool diagnostics: " + " | ".join(diagnostics))
                  raise RuntimeError("The decoded file is not a valid JKS or PKCS12 keystore with the configured password and alias.")
              report.append(f"Decoded keystore size: {len(data)} bytes")
              report.append("Keystore decode: SUCCESS")
              report.append(f"Keystore validation: SUCCESS ({accepted_type})")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"WV_ANDROID_KEYSTORE_PATH={path}\n")
                  f.write(f"WV_ANDROID_KEYSTORE_PASSWORD={os.environ['WV_ANDROID_KEYSTORE_PASSWORD']}\n")
                  f.write(f"WV_ANDROID_KEY_ALIAS={os.environ['WV_ANDROID_KEY_ALIAS']}\n")
                  f.write(f"WV_ANDROID_KEY_PASSWORD={os.environ['WV_ANDROID_KEY_PASSWORD']}\n")
          except (ValueError, binascii.Error, RuntimeError) as e:
              report.append("RESULT: FAILED")
              report.append("Reason: " + str(e))
              pathlib.Path("west-vill-signing-diagnostic.txt").write_text("\n".join(report) + "\n")
              print("\n".join(report))
              sys.exit(1)
          pathlib.Path("west-vill-signing-diagnostic.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Prepare WEST-VILL notification sound
        run: |
          mkdir -p app/src/main/res/raw
          python3 scripts/create_notification_sound.py app/src/main/res/raw/westvill_pichon.wav
          python3 scripts/create_madre_notification_sound.py app/src/main/res/raw/westvill_madre.wav
          test -s app/src/main/res/raw/westvill_pichon.wav
          test -s app/src/main/res/raw/westvill_madre.wav
        working-directory: west-vill-android

      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: west-vill-android

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose west-vill-android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: west-vill-android-release
          path: west-vill-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: west-vill-android-failure-diagnostics
          path: west-vill-signing-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 30
