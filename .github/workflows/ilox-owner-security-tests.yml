name: ILOX owner security tests

on:
  push:
    branches:
      - security/owner-key-v127
    paths:
      - "supabase/functions/ilox-owner-security/**"
      - ".github/workflows/ilox-owner-security-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/ilox-owner-security/**"
      - ".github/workflows/ilox-owner-security-tests.yml"

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check owner security Edge Function
        run: deno check supabase/functions/ilox-owner-security/index.ts
      - name: Check owner page JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("ilox-pwa/owner-pilot/index.html").read_text()
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Owner page module script not found")
          pathlib.Path("/tmp/ilox-owner-pilot.mjs").write_text(match.group(1))
          PY
          node --check /tmp/ilox-owner-pilot.mjs
      - name: Test owner security cryptographic helpers
        run: deno test supabase/functions/ilox-owner-security/security-core.test.ts
