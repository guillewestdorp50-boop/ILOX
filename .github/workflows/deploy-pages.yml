name: Publicar ILOX — mundo natural realista

on:
  push:
    branches: [main]
    paths:
      - 'manifest.webmanifest'
      - 'scripts/prepare_ilox_island.py'
      - 'LICENSE-Island.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ["Validar ILOX urbano-rural"]
    types: [completed]
    branches: [experiment/urban-rural-map]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener ILOX estable
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Obtener prueba urbano-rural aislada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'experiment/urban-rural-map' }}
          path: urban-rural-source
          persist-credentials: false

      - name: Obtener mundo Island (MIT, commit fijado)
        uses: actions/checkout@v4
        with:
          repository: StarKnightt/island
          ref: 651d582f991a1ba0efc2cf358c890bb6bb29b76f
          path: island-source
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: island-source/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: island-source
        run: pnpm install --frozen-lockfile

      - name: Adaptar el mundo a ILOX
        run: |
          python3 scripts/prepare_ilox_island.py island-source
          cp manifest.webmanifest island-source/public/manifest.webmanifest
          cp LICENSE-Island.txt island-source/public/LICENSE-Island.txt

      - name: Regenerar terreno, río y cascada para el mapa de 2 millones de m²
        working-directory: island-source
        run: pnpm gen:island

      - name: Verificar límites del mapa y anclaje de la cascada
        working-directory: island-source
        run: |
          node -e "const m=require('./public/world/meta.json'); const target=Math.sqrt(2000000); if(Math.abs(m.worldSize-target)>0.01) throw new Error('Unexpected world size: '+m.worldSize); if(!(m.falls.top < m.falls.lipGround && m.falls.top > m.falls.bottom)) throw new Error('Waterfall lip is not anchored to the cliff: '+JSON.stringify(m.falls)); console.log('World:',m.worldSize,'m square; waterfall:',(m.falls.lipGround-m.falls.top).toFixed(2),'m below lip,',(m.falls.top-m.falls.bottom).toFixed(2),'m drop');"

      - name: Compilar y verificar mundo estable
        working-directory: island-source
        run: |
          pnpm build
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/world/height.bin.gz
          test -s dist/assets/character/hero.glb
          test -s dist/assets/rocks/boulders.glb
          grep -q 'ILOX' dist/index.html

      - name: Validar escenario urbano-rural
        run: |
          node --check urban-rural-source/app.js
          test -s urban-rural-source/index.html
          test -s urban-rural-source/styles.css
          test -s urban-rural-source/manifest.webmanifest

      - name: Preparar sitio PWA estable y vista experimental
        run: |
          mkdir -p _site
          cp -R island-source/dist/. _site/
          mkdir -p _site/urban-rural
          cp urban-rural-source/index.html urban-rural-source/styles.css urban-rural-source/app.js urban-rural-source/manifest.webmanifest _site/urban-rural/
          touch _site/.nojekyll _site/urban-rural/.nojekyll
          test -s _site/index.html
          test -s _site/urban-rural/index.html
          test -s _site/urban-rural/app.js

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
