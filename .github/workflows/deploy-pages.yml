name: Publicar ILOX Web

on:
  push:
    branches: [main, experiment/ilox-landscape-gameplay-v2]
    paths:
      - 'manifest.webmanifest'
      - 'scripts/prepare_ilox_forest.py'
      - 'ilox-forest-index.html'
      - 'ilox-forest.css'
      - 'LICENSE-TheForest.txt'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener ILOX
        uses: actions/checkout@v4

      - name: Obtener la base The Forest (MIT)
        uses: actions/checkout@v4
        with:
          repository: jalexiscv/TheForest
          ref: d343fe58a1bd6b72c4fadcc09eec332519ec41e1
          path: vendor/theforest

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vendor/theforest/package-lock.json

      - name: Instalar dependencias
        working-directory: vendor/theforest
        run: npm ci

      - name: Aplicar adaptación ILOX
        run: |
          python3 scripts/prepare_ilox_forest.py vendor/theforest
          mkdir -p vendor/theforest/public
          cp manifest.webmanifest vendor/theforest/public/manifest.webmanifest
          cp LICENSE-TheForest.txt vendor/theforest/LICENSE-TheForest.txt

      - name: Verificar TypeScript
        working-directory: vendor/theforest
        run: npm run typecheck

      - name: Compilar mundo natural 3D
        working-directory: vendor/theforest
        run: npm run build

      - name: Preparar sitio PWA y vista previa del mundo nuevo
        run: |
          mkdir -p _site
          cp -R vendor/theforest/dist/. _site/
          cp LICENSE-TheForest.txt THIRD_PARTY_LICENSES.md _site/
          mkdir -p _site/preview-v2
          cp index.html app.js styles.css manifest.webmanifest _site/preview-v2/
          touch _site/.nojekyll _site/preview-v2/.nojekyll

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
