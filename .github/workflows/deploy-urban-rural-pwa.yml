name: Validar ILOX urbano-rural

on:
  push:
    branches: [experiment/urban-rural-map]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - '.github/workflows/deploy-urban-rural-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener escenario experimental
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar archivos de la PWA
        run: |
          node --check app.js
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          grep -q 'type="module" src="./app.js' index.html
          grep -q 'urbanRuralMode = true' app.js
          echo "PWA urbano-rural validada."
