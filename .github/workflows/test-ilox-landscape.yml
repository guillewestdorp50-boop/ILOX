name: Validar ILOX vertical

on:
  push:
    branches: [experiment/ilox-landscape-gameplay-v2]
    paths:
      - 'scripts/prepare_ilox_forest.py'
      - 'ilox-src/**'
      - 'ilox-forest-index.html'
      - 'ilox-forest.css'
      - 'ilox-pwa/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/test-ilox-landscape.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener ILOX
        uses: actions/checkout@v4
      - name: Obtener The Forest (MIT)
        uses: actions/checkout@v4
        with:
          repository: jalexiscv/TheForest
          ref: d343fe58a1bd6b72c4fadcc09eec332519ec41e1
          path: vendor/theforest
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/theforest/package-lock.json
      - name: Instalar dependencias
        working-directory: vendor/theforest
        run: npm ci
      - name: Aplicar integración ILOX
        run: |
          python3 scripts/prepare_ilox_forest.py vendor/theforest
          mkdir -p vendor/theforest/public
          cp manifest.webmanifest vendor/theforest/public/manifest.webmanifest
          cp LICENSE-TheForest.txt vendor/theforest/LICENSE-TheForest.txt
      - name: Validar TypeScript y compilar el mundo
        working-directory: vendor/theforest
        run: |
          npm run typecheck
          npm run build
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          grep -q 'sprint-button' dist/index.html
      - name: Validar PWA ILOX y orientación vertical
        run: |
          node --check ilox-pwa/app.js
          node --input-type=module --check < ilox-pwa/game.js
          test -s ilox-pwa/game.js
          node --check ilox-pwa/sw.js
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('ilox-pwa/manifest.webmanifest','utf8'));if(m.orientation!=='portrait')throw new Error('PWA must request portrait orientation');for(const f of ['index.html','styles.css','app.js','manifest.webmanifest','sw.js','icon.svg'])if(!fs.statSync('ilox-pwa/'+f).size)throw new Error('Missing '+f);"
          grep -q \"orientation.*portrait\" manifest.webmanifest
          grep -q "setSprintInput" ilox-src/main.ts
          grep -q "setSprintInput" ilox-src/ThirdPersonController.ts
          grep -q "2 muestras simples" scripts/prepare_ilox_forest.py
          test ! -e PDA
          echo "ILOX portrait PWA and touch controls verified; PDA folder is absent from this branch."

  # Publica la PWA experimental en /ilox sin reemplazar el sitio estable.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Obtener la versión experimental
        uses: actions/checkout@v4
        with:
          path: experimental
      - name: Obtener la base estable publicada
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Obtener The Forest (MIT)
        uses: actions/checkout@v4
        with:
          repository: jalexiscv/TheForest
          ref: d343fe58a1bd6b72c4fadcc09eec332519ec41e1
          path: vendor/theforest
          persist-credentials: false
      - name: Instalar dependencias
        working-directory: vendor/theforest
        run: npm ci
      - name: Reconstruir el sitio estable sin modificarlo
        run: |
          cd stable
          python3 scripts/prepare_ilox_forest.py ../vendor/theforest
          mkdir -p ../vendor/theforest/public
          cp manifest.webmanifest ../vendor/theforest/public/manifest.webmanifest
          cp LICENSE-TheForest.txt ../vendor/theforest/LICENSE-TheForest.txt
          cd ..
          npm --prefix vendor/theforest run typecheck
          npm --prefix vendor/theforest run build
      - name: Integrar ILOX experimental en su ruta independiente
        run: |
          mkdir -p _site
          cp -R vendor/theforest/dist/. _site/
          cp stable/LICENSE-TheForest.txt stable/THIRD_PARTY_LICENSES.md _site/
          mkdir -p _site/preview-v2
          cp stable/index.html stable/app.js stable/styles.css stable/manifest.webmanifest _site/preview-v2/
          mkdir -p _site/ilox
          cp -R experimental/ilox-pwa/. _site/ilox/
          touch _site/.nojekyll _site/preview-v2/.nojekyll _site/ilox/.nojekyll
          test -s _site/ilox/index.html
          test -s _site/ilox/manifest.webmanifest
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('_site/ilox/manifest.webmanifest','utf8'));if(m.id!=='/ILOX/ilox/'||m.start_url!=='/ILOX/ilox/'||m.scope!=='/ILOX/ilox/')throw new Error('ILOX PWA identity or scope incorrect');"
      - name: Subir sitio completo a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
