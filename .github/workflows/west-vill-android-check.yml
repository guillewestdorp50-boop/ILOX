name: WEST-VILL Android compile check

on:
  push:
    branches: [west-vill-android]
    paths:
      - 'west-vill-android/**'
      - '.github/workflows/west-vill-android-check.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug build (not for distribution)
        run: gradle --no-daemon :app:assembleDebug
        working-directory: west-vill-android
