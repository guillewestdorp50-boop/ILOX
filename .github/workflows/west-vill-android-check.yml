name: WEST-VILL Android compile check

on:
  push:
    branches: [west-vill-android]
    paths:
      - 'west-vill-android/**'
      - '.github/workflows/west-vill-android-check.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate WEST-VILL launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 west-vill-android/scripts/generate_icons.py
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate notification sound for Android compile check
        run: |
          mkdir -p app/src/main/res/raw
          python3 scripts/create_notification_sound.py app/src/main/res/raw/westvill_pichon.wav
        working-directory: west-vill-android
      - name: Compile debug build (not for distribution)
        run: gradle --no-daemon :app:assembleDebug
        working-directory: west-vill-android
