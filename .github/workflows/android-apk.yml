name: ILOX Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar archivos web dentro de la app
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html styles.css app.js manifest.webmanifest app/src/main/assets/www/

      - name: Compilar APK de prueba
        run: gradle --no-daemon assembleDebug

      - name: Publicar instalador de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ILOX-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
