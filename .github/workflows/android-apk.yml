name: ILOX Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descargar recursos 3D gratuitos CC0
        run: python3 scripts/fetch_polyhaven_assets.py

      - name: Validar JavaScript y preparar archivos web dentro de la app
        run: |
          node --check app.js
          mkdir -p app/src/main/assets/www
          cp index.html styles.css app.js manifest.webmanifest app/src/main/assets/www/
          cp -R assets app/src/main/assets/www/assets

      - name: Compilar APK de prueba
        run: gradle --no-daemon assembleDebug

      - name: Publicar instalador de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ILOX-Android-urban-rural-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
