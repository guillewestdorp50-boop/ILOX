name: WEST-VILL Android APK

on:
  push:
    branches: [production]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'ilox-pwa/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: west-vill-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar icono de WEST-VILL
        run: |
          python3 -m pip install --user pillow
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('ilox-pwa/west-vill-logistica.jpg').convert('RGBA')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              source.resize((size,size), Image.Resampling.LANCZOS).save(f'app/src/main/res/mipmap-{density}/ic_launcher.png')
          PY

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar archivos y JavaScript de WEST-VILL
        run: |
          test -f ilox-pwa/index.html
          test -f ilox-pwa/auth.js
          test -f ilox-pwa/admin.js
          test -f ilox-pwa/admin.css
          node --check ilox-pwa/auth.js
          node --check ilox-pwa/admin.js
          node --check ilox-pwa/theme.js
          grep -q "versionCode 105" app/build.gradle
          grep -q "WEST-VILL" app/src/main/AndroidManifest.xml

      - name: Empaquetar WEST-VILL dentro del APK
        run: |
          mkdir -p app/src/main/assets/www
          cp ilox-pwa/index.html ilox-pwa/admin.css ilox-pwa/auth.js ilox-pwa/admin.js ilox-pwa/manifest.webmanifest ilox-pwa/sw.js ilox-pwa/theme.js ilox-pwa/west-vill-logistica.jpg app/src/main/assets/www/

      - name: Compilar APK Android
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK WEST-VILL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: west-vill-v105-android
          name: WEST-VILL V105 — Instalador Android
          body: WEST-VILL V105. Corrección del campo de kilómetros de la calculadora para Android WebView; se conserva la identidad de paquete com.ilox.game.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
