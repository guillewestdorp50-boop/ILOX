name: Verificar integración ILOX + The Forest

on:
  push:
    branches: [integracion-the-forest]
    paths:
      - 'scripts/prepare_ilox_forest.py'
      - 'ilox-forest-index.html'
      - 'ilox-forest.css'
      - 'manifest.webmanifest'
      - '.github/workflows/test-ilox-forest.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener ILOX
        uses: actions/checkout@v4

      - name: Obtener la base The Forest (MIT)
        uses: actions/checkout@v4
        with:
          repository: jalexiscv/TheForest
          ref: d343fe58a1bd6b72c4fadcc09eec332519ec41e1
          path: vendor/theforest

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vendor/theforest/package-lock.json

      - name: Instalar dependencias
        working-directory: vendor/theforest
        run: npm ci

      - name: Aplicar adaptación ILOX
        run: |
          python3 scripts/prepare_ilox_forest.py vendor/theforest
          mkdir -p vendor/theforest/public
          cp manifest.webmanifest vendor/theforest/public/manifest.webmanifest
          cp LICENSE-TheForest.txt vendor/theforest/LICENSE-TheForest.txt

      - name: Verificar TypeScript
        working-directory: vendor/theforest
        run: npm run typecheck

      - name: Compilar mundo 3D
        working-directory: vendor/theforest
        run: npm run build

      - name: Comprobar artefactos PWA
        run: |
          test -s vendor/theforest/dist/index.html
          test -s vendor/theforest/dist/manifest.webmanifest
          test -s vendor/theforest/dist/models/relief.bin
          test -s vendor/theforest/dist/textures/rock_albedo.jpg
          grep -q 'ILOX' vendor/theforest/dist/index.html
