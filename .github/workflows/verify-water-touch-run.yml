name: Verify ILOX waterfall and mobile controls

on:
  push:
    branches: [fix/2m-water-touch-run]
    paths:
      - 'scripts/prepare_ilox_island.py'
      - '.github/workflows/verify-water-touch-run.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StarKnightt/island
          ref: 651d582f991a1ba0efc2cf358c890bb6bb29b76f
          path: island-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: island-source/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: island-source
        run: pnpm install --frozen-lockfile
      - name: Apply ILOX adaptation
        run: |
          python3 scripts/prepare_ilox_island.py island-source
          cp manifest.webmanifest island-source/public/manifest.webmanifest
          cp LICENSE-Island.txt island-source/public/LICENSE-Island.txt
      - name: Regenerate the resized island terrain and waterfall metadata
        working-directory: island-source
        run: pnpm gen:island
      - name: Build and verify
        working-directory: island-source
        run: |
          pnpm build
          test -s dist/index.html
          test -s dist/world/height.bin.gz
          test -s dist/world/meta.json
          test -s dist/assets/character/hero.glb
          grep -q 'ILOX' dist/index.html
          grep -q 'value="0"' dist/index.html
          grep -q 'value="40"' dist/index.html
